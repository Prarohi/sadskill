name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, 'luna/integration-candidate-*' ]

permissions:
  contents: read

# Prevent superseded PR revisions from wasting CI capacity.
# The group is per PR (or branch), never shared across independent PRs.
concurrency:
  group: sadskill-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-rls:
    name: Native PostgreSQL RLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Cache pinned PostgreSQL fixture image
        run: docker pull postgres@sha256:dfbbb0ad8cab91d41e99123664e37a9b25d0413426d4fb3154e4d668e5d35246

      - name: Verify native PostgreSQL policies
        run: python3 benchmarks/fixtures/postgres-rls/test_rls.py

      - name: Verify disabled-RLS negative control
        run: |
          set +e
          python3 benchmarks/fixtures/postgres-rls/test_rls.py --disable-rls > negative-control.log 2>&1
          status=$?
          set -e
          cat negative-control.log
          test "$status" -ne 0
          grep -q 'FAIL: test_' negative-control.log
          ! grep -q '^ERROR:' negative-control.log

  verify:
    name: Verify sadskill (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check Python and Bash syntax and patch whitespace
        run: |
          python3 -m compileall -q scripts benchmarks tests
          bash -n bin/sad install.sh uninstall.sh scripts/git-guardrail.sh skills/sadskill/hooks/git-guardrail.sh scripts/sandbox.sh scripts/web-install.sh
          git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}"...HEAD

      - name: Run Python regression tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v

      - name: Run skill-contract unit tests (explicit discovery)
        # tests/skill-contract is not a Python package; normal discovery rooted
        # at tests/ does not descend into it. This closes that coverage gap.
        run: python3 -m unittest discover -s tests/skill-contract -p 'test_*.py' -v

      - name: Run sadskill Verification Suite
        run: python3 scripts/verify.py

      - name: Run sadskill Benchmarks Suite
        run: python3 benchmarks/runner.py

      - name: Verify Git Safety Guardrail Hook
        run: |
          echo "Testing blocked command..."
          set +e
          echo "git reset --hard HEAD~1" | ./scripts/git-guardrail.sh 2>/dev/null
          STATUS=$?
          set -e
          if [ $STATUS -ne 2 ]; then
            echo "Expected exit code 2 from guardrail, got $STATUS"
            exit 1
          fi

          echo "Testing pre-push branch deletion..."
          set +e
          echo "(delete) 0000000000000000000000000000000000000000 refs/heads/main 1111111111111111111111111111111111111111" | ./scripts/git-guardrail.sh 2>/dev/null
          STATUS_PREPUSH=$?
          set -e
          if [ $STATUS_PREPUSH -ne 2 ]; then
            echo "Expected exit code 2 from pre-push deletion guardrail, got $STATUS_PREPUSH"
            exit 1
          fi

          echo "Testing allowed command..."
          echo "git status" | ./scripts/git-guardrail.sh
          echo "Guardrail verification successful."

      - name: Verify Multi-Agent Sandbox Installation & Restore
        run: |
          SANDBOX_DIR=$(mktemp -d)
          echo "Testing installation in ${SANDBOX_DIR}..."
          mkdir -p "${SANDBOX_DIR}/.codex/prompts"
          echo "ORIGINAL_USER_PROMPT" > "${SANDBOX_DIR}/.codex/prompts/sad-plan.md"

          HOME="${SANDBOX_DIR}" ./install.sh all
          test -d "${SANDBOX_DIR}/.codex/skills/sadskill"
          test -d "${SANDBOX_DIR}/.claude/skills/sadskill"
          test -d "${SANDBOX_DIR}/.gemini/skills/sadskill"

          echo "Testing non-destructive backup on reinstall..."
          HOME="${SANDBOX_DIR}" ./install.sh all
          ls -d "${SANDBOX_DIR}/.codex/prompts/sad-plan.md.bak."*

          echo "Testing uninstallation with --restore-previous..."
          HOME="${SANDBOX_DIR}" ./uninstall.sh --restore-previous --clean-backups
          test ! -d "${SANDBOX_DIR}/.codex/skills/sadskill"
          test ! -d "${SANDBOX_DIR}/.claude/skills/sadskill"
          test -f "${SANDBOX_DIR}/.codex/prompts/sad-plan.md"
          grep -q "ORIGINAL_USER_PROMPT" "${SANDBOX_DIR}/.codex/prompts/sad-plan.md"

          rm -rf "${SANDBOX_DIR}"
          echo "Sandbox installation & restore verified."

      - name: Test Single Skill Discovery
        if: matrix.node-version == 22
        run: |
          npx --yes skills@1.7.4 add . -l
