name: CLI initialization and memory safety

on:
  push:
    branches: [ 'audit/cli-*' ]
  pull_request:
    paths:
      - 'scripts/sad_cli.py'
      - 'scripts/sad_memory.py'
      - 'tests/test_cli_init_symlink.py'
      - 'tests/test_concurrent_memory.py'
      - 'tests/test_memory_search.py'
      - 'tests/test_cli_memory_workflow_contract.py'
      - 'docs/compatibility.md'
      - '.github/workflows/cli-init-safety.yml'

permissions:
  contents: read

jobs:
  cli-init-security:
    name: CLI init security regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Verify syntax
        run: python3 -m compileall -q scripts benchmarks tests
      - name: Full Python regression suite
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - name: Skill-contract regression suite
        run: python3 -m unittest discover -s tests/skill-contract -p 'test_*.py' -v

  macos-memory-filesystem:
    name: Native macOS memory/filesystem regressions
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Run memory filesystem and search regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_concurrent_memory.py' -v
          python3 -m unittest discover -s tests -p 'test_memory_search.py' -v

  windows-memory-unsupported:
    name: Native Windows memory CLI fails closed
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Verify unsupported memory CLI fails closed without writing
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $project = Join-Path $env:RUNNER_TEMP 'sadskill-memory-unsupported-smoke'
          $outputPath = Join-Path $env:RUNNER_TEMP 'sadskill-memory-unsupported-output.txt'
          New-Item -ItemType Directory -Force -Path $project | Out-Null
          & python scripts/sad_memory.py append-event --type custom --payload '{}' --project-root $project 1> $outputPath 2>&1
          $exitCode = $LASTEXITCODE
          $output = Get-Content -Raw -Path $outputPath
          Write-Host $output
          if ($exitCode -eq 0) { throw 'Windows memory CLI unexpectedly succeeded' }
          if (($output -join "`n") -notmatch 'safe project-memory .* unavailable on this platform') {
            throw "Windows memory CLI did not report its unsupported platform boundary: $output"
          }
          if (Test-Path (Join-Path $project '.sad')) {
            throw 'Unsupported Windows memory CLI created a project memory directory'
          }
          $global:LASTEXITCODE = 0
