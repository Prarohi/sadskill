name: CLI initialization safety

on:
  push:
    branches: [ 'audit/cli-*' ]
  pull_request:
    paths:
      - 'scripts/sad_cli.py'
      - 'tests/test_cli_init_symlink.py'
      - '.github/workflows/cli-init-safety.yml'

permissions:
  contents: read

jobs:
  cli-init-security:
    name: CLI init security regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
      - name: Verify syntax
        run: python3 -m compileall -q scripts benchmarks tests
      - name: Full Python regression suite
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - name: Skill-contract regression suite
        run: python3 -m unittest discover -s tests/skill-contract -p 'test_*.py' -v
