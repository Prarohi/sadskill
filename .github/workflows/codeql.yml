name: CodeQL security analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, 'luna/integration-candidate-*' ]

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-codeql:
    name: CodeQL Python security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: python
          queries: security-extended
      - name: Analyze Python
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:python
