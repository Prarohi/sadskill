name: Native Linux Bubblewrap containment

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/sandbox.sh'
      - 'scripts/sandbox-paths.sh'
      - 'tests/test_sandbox.py'
      - '.github/workflows/sandbox-integration.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/sandbox.sh'
      - 'scripts/sandbox-paths.sh'
      - 'tests/test_sandbox.py'
      - '.github/workflows/sandbox-integration.yml'

permissions:
  contents: read

concurrency:
  group: sandbox-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bubblewrap-containment:
    name: Native Linux Bubblewrap containment
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout audited source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
      - name: Install native Bubblewrap binary
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends bubblewrap
          command -v bwrap
          bwrap --version
      - name: Require actual sandbox filesystem and namespace regressions
        env:
          SADSKILL_REQUIRE_BWRAP: '1'
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_sandbox.py' -v
